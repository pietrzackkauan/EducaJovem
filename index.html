        id: 1,

        options: [

      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ej_theme') === 'dark');
      const [activeTab, setActiveTab] = useState('overview'); // student: overview, courses, futuca, profile, settings | company: overview, search, saved, jobs
      
      // Estado de Dados
      const [courses, setCourses] = useState(() => {
        const saved = localStorage.getItem('ej_courses');
        return saved ? JSON.parse(saved) : DEFAULT_COURSES;
      });
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [selectedLesson, setSelectedLesson] = useState(null);
      
      const [candidates, setCandidates] = useState(() => {
        const saved = localStorage.getItem('ej_candidates');
        return saved ? JSON.parse(saved) : DEFAULT_CANDIDATES;
      });
      
      const [searchTerm, setSearchTerm] = useState('');
      const [filterArea, setFilterArea] = useState('all');
      const [toastMessage, setToastMessage] = useState(null);
      const [offerModalCandidate, setOfferModalCandidate] = useState(null);
      const [offerMessage, setOfferMessage] = useState('');

      // Quiz State
      const [quizIndex, setQuizIndex] = useState(0);
      const [quizSelected, setQuizSelected] = useState(null);
      const [quizScore, setQuizScore] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);

      // Student Profile State
      const [studentProfile, setStudentProfile] = useState({
        name: "Kauan Pietrzack",
        email: "kauan.pietrzack@email.com",
        city: "Curitiba - PR",
        area: "Tecnologia & Inovação",
        xp: 850,
        level: "Nível 4 - Especialista Júnior",
        skills: ["React", "JavaScript", "Excel Avançado", "Comunicação", "Git", "Atendimento"]
      });

      // Sincronização de Tema
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('ej_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('ej_theme', 'light');
        }
      }, [darkMode]);

      // Salvar cursos e candidatos no localStorage
      useEffect(() => {
        localStorage.setItem('ej_courses', JSON.stringify(courses));
      }, [courses]);

      useEffect(() => {
        localStorage.setItem('ej_candidates', JSON.stringify(candidates));
      }, [candidates]);

      const showToast = (msg, icon = "fa-check-circle") => {
        setToastMessage({ text: msg, icon });
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleToggleSaveCandidate = (id) => {
        setCandidates(prev => prev.map(c => {
          if (c.id === id) {
            const nextState = !c.saved;
            showToast(nextState ? `${c.name} salvo aos seus talentos!` : `${c.name} removido dos salvos.`, nextState ? "fa-bookmark" : "fa-trash");
            return { ...c, saved: nextState };
          }
          return c;
        }));
      };

      const handleSendOffer = (e) => {
        e.preventDefault();
        showToast(`Proposta enviada com sucesso para ${offerModalCandidate.name}!`, "fa-paper-plane");
        if (window.confetti) {
          window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
        setOfferModalCandidate(null);
        setOfferMessage('');
      };

      const handleCompleteLesson = (courseId, lessonId) => {
        setCourses(prev => prev.map(course => {
          if (course.id === courseId) {
            const updatedLessons = course.lessons.map(l => l.id === lessonId ? { ...l, completed: true } : l);
            const completedCount = updatedLessons.filter(l => l.completed).length;
            const newProgress = Math.round((completedCount / updatedLessons.length) * 100);
            return {
              ...course,
              lessons: updatedLessons,
              completedLessons: completedCount,
              progress: newProgress
            };
          }
          return course;
        }));
        showToast("Aula concluída! +25 XP conquistados", "fa-star");
        if (window.confetti) {
          window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        }
      };

      const handleAnswerQuiz = (optionIdx) => {
        if (quizSelected !== null) return;
        setQuizSelected(optionIdx);
        const currentQ = QUIZ_QUESTIONS[quizIndex];
        const isCorrect = optionIdx === currentQ.correct;
        
        if (isCorrect) {
          setQuizScore(prev => prev + 1);
          showToast("Resposta correta! +50 XP", "fa-check");
        } else {
          showToast("Resposta incorreta. Revise o conteúdo!", "fa-times-circle");
        }
      };

      const handleNextQuiz = () => {
        if (quizIndex + 1 < QUIZ_QUESTIONS.length) {
          setQuizIndex(prev => prev + 1);
          setQuizSelected(null);
        } else {
          setQuizFinished(true);
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });
          }
        }
      };

      const handleStartCourse = (course) => {
        setSelectedCourse(course);
        setSelectedLesson(course.lessons[0]);
        setView('course-view');
      };

      // FILTRAGEM DE CANDIDATOS
      const filteredCandidates = useMemo(() => {
        return candidates.filter(c => {
          const matchSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              c.skills.some(s => s.toLowerCase().includes(searchTerm.toLowerCase())) ||
                              c.city.toLowerCase().includes(searchTerm.toLowerCase());
          const matchArea = filterArea === 'all' || c.area === filterArea;
          return matchSearch && matchArea;
        });
      }, [candidates, searchTerm, filterArea]);

                </div>
                <div>

                    EducaJovem
                  </span>
                  <span className="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300">
                    Pro
                  </span>
                </div>
              </div>

                {/* BOTÃO DARK MODE */}

                      Sou Jovem
                    </button>

                    <div className="hidden sm:flex flex-col text-right">

                        <div className="text-center sm:text-left flex-1">
                          <h2 className="text-2xl font-bold">{studentProfile.name}</h2>
                          <p className="text-sm text-slate-500 dark:text-slate-400 flex items-center justify-center sm:justify-start gap-2 mt-1">
                            <i className="fas fa-map-marker-alt text-red-500"></i> {studentProfile.city} • <i className="fas fa-envelope text-blue-500"></i> {studentProfile.email}
                          </p>
                          <div className="mt-3 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300 text-xs font-bold">
                            <i className="fas fa-medal text-amber-500"></i> {studentProfile.level} ({studentProfile.xp} XP)
                          </div>
                        </div>
                      </div>

                      <div className="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800">
                        <h4 className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">
                          Minhas Habilidades Comprovadas
                        </h4>
                        <div className="flex flex-wrap gap-2">
                          {studentProfile.skills.map((skill, i) => (
                            <span key={i} className="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                              <i className="fas fa-check text-emerald-500 mr-1.5"></i> {skill}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 3. SALA DE AULA (VISUALIZAÇÃO DE CURSO E CONTEÚDO) */}
            {view === 'course-view' && selectedCourse && (
              <div className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 animate-fade-in flex flex-col lg:flex-row gap-8">
                {/* MENU LATERAL DE AULAS */}
                <div className="w-full lg:w-80 glass-card p-6 rounded-3xl h-fit">
                  <button
                    onClick={() => { setView('student-dash'); setActiveTab('courses'); }}
                    className="text-xs font-bold text-blue-600 dark:text-blue-400 hover:underline mb-4 flex items-center gap-1"
                  >
                    <i className="fas fa-arrow-left"></i> Voltar aos Cursos
                  </button>

                  <h3 className="font-bold text-lg leading-tight">{selectedCourse.title}</h3>
                  <div className="mt-2 text-xs text-slate-500 dark:text-slate-400 mb-4">
                    {selectedCourse.completedLessons} de {selectedCourse.lessons.length} aulas concluídas ({selectedCourse.progress}%)
                  </div>

                  <div className="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden mb-6">
                    <div className="bg-gradient-to-r from-blue-600 to-amber-500 h-full" style={{ width: `${selectedCourse.progress}%` }}></div>
                  </div>

                  <div className="space-y-2">
                    {selectedCourse.lessons.map(lesson => (
                      <button
                        key={lesson.id}
                        onClick={() => setSelectedLesson(lesson)}
                        className={`w-full text-left p-3 rounded-xl text-xs font-semibold flex items-center justify-between transition-all ${
                          selectedLesson?.id === lesson.id
                            ? 'bg-blue-600 text-white shadow-md'
                            : 'hover:bg-slate-100 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-300'
                        }`}
                      >
                        <span className="truncate mr-2">{lesson.title}</span>
                        <i className={`fas ${lesson.completed ? 'fa-check-circle text-emerald-400' : 'fa-circle text-slate-400'} text-sm`}></i>
                      </button>
                    ))}
                  </div>
                </div>

                {/* ÁREA DE LEITURA E CONTEÚDO */}
                <div className="flex-1 glass-card p-8 rounded-3xl flex flex-col justify-between">
                  {selectedLesson ? (
                    <div>
                      <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4 mb-6">
                        <span className="text-xs font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400">
                          {selectedCourse.title}
                        </span>
                        <span className="text-xs text-slate-500 dark:text-slate-400">
                          Aula {selectedLesson.id}
                        </span>
                      </div>

                      <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mb-6">
                        {selectedLesson.title}
                      </h2>

                      <div className="prose dark:prose-invert max-w-none text-slate-700 dark:text-slate-300 leading-relaxed space-y-4 text-base">
                        <p>{selectedLesson.content}</p>
                        <div className="bg-blue-50 dark:bg-blue-950/40 p-5 rounded-2xl border border-blue-200 dark:border-blue-800/60 my-6">
                          <h4 className="font-bold text-blue-900 dark:text-blue-300 text-sm flex items-center gap-2 mb-2">
                            <i className="fas fa-lightbulb text-amber-500"></i> Dica Prática de Empregabilidade
                          </h4>
                          <p className="text-xs text-slate-600 dark:text-slate-400">
                            Recrutadores adoram candidatos que demonstram domínio prático dessa habilidade durante a entrevista técnica. Adicione este tópico ao seu currículo!
                          </p>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-12 text-slate-500">Selecione uma aula ao lado.</div>
                  )}

                  <div className="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <button
                      onClick={() => {
                        const idx = selectedCourse.lessons.findIndex(l => l.id === selectedLesson?.id);
                        if (idx > 0) setSelectedLesson(selectedCourse.lessons[idx - 1]);
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                    >
                      <i className="fas fa-chevron-left mr-1"></i> Aula Anterior
                    </button>

                    <button
                      onClick={() => {
                        if (selectedCourse && selectedLesson) {
                          handleCompleteLesson(selectedCourse.id, selectedLesson.id);
                        }
                      }}
                      className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20 transition-all flex items-center gap-2"
                    >
                      <i className="fas fa-check"></i> Marcar como Concluída
                    </button>

                    <button
                      onClick={() => {
                        const idx = selectedCourse.lessons.findIndex(l => l.id === selectedLesson?.id);
                        if (idx < selectedCourse.lessons.length - 1) setSelectedLesson(selectedCourse.lessons[idx + 1]);
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-bold text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-colors"
                    >
                      Próxima Aula <i className="fas fa-chevron-right ml-1"></i>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 4. ÁREA DA EMPRESA (PAINEL DE RECRUTAMENTO) */}
            {view === 'company-dash' && (
              <div className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
                {/* HEADER DA EMPRESA */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-6 mb-8">
                  <div>
                    <h2 className="text-3xl font-extrabold">Painel de Recrutamento</h2>
                    <p className="text-sm text-slate-500 dark:text-slate-400">Banco de talentos qualificados e prontos para contratação.</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setActiveTab('overview')}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                        activeTab === 'overview' ? 'bg-blue-600 text-white' : 'glass-card hover:bg-slate-100 dark:hover:bg-slate-800'
                      }`}
                    >
                      <i className="fas fa-users mr-1.5"></i> Todos os Talentos ({candidates.length})
                    </button>
                    <button
                      onClick={() => setActiveTab('saved')}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                        activeTab === 'saved' ? 'bg-amber-500 text-slate-950 font-bold' : 'glass-card hover:bg-slate-100 dark:hover:bg-slate-800'
                      }`}
                    >
                      <i className="fas fa-bookmark mr-1.5"></i> Salvos ({candidates.filter(c => c.saved).length})
                    </button>
                  </div>
                </div>

                {/* BARRA DE PESQUISA E FILTROS */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                  <div className="sm:col-span-2 relative">
                    <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input
                      type="text"
                      placeholder="Buscar por nome, habilidade (ex: Excel, React, Vendas) ou cidade..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-11 pr-4 py-3 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder:text-slate-400"
                    />
                  </div>

                  <div>
                    <select
                      value={filterArea}
                      onChange={(e) => setFilterArea(e.target.value)}
                      className="w-full px-4 py-3 rounded-2xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    >
                      <option value="all">Todas as Áreas de Atuação</option>
                      <option value="Tecnologia">Tecnologia & TI</option>
                      <option value="Administrativo">Administrativo & Finanças</option>
                      <option value="Marketing">Marketing & Design</option>
                      <option value="Atendimento">Atendimento & Vendas</option>
                    </select>
                  </div>
                </div>

                {/* GRID DE TALENTOS */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {(activeTab === 'saved' ? filteredCandidates.filter(c => c.saved) : filteredCandidates).map(candidate => (
                    <div key={candidate.id} className="glass-card p-6 sm:p-7 rounded-3xl hover:shadow-xl transition-all flex flex-col justify-between border-2 border-transparent hover:border-blue-500/40">
                      <div>
                        <div className="flex items-start justify-between gap-4 mb-4">
                          <div className="flex items-center gap-3.5">
                            <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 text-white flex items-center justify-center text-xl font-bold shadow-md">
                              {candidate.name.split(' ').map(n => n[0]).slice(0, 2).join('')}
                            </div>
                            <div>
                              <h3 className="text-lg font-bold text-slate-900 dark:text-white leading-tight">{candidate.name}</h3>
                              <div className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                {candidate.age} anos • <i className="fas fa-map-marker-alt text-red-500"></i> {candidate.city}
                              </div>
                            </div>
                          </div>

                          <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-100 dark:bg-blue-900/60 text-blue-800 dark:text-blue-300">
                            {candidate.match}% Match
                          </span>
                        </div>

                        <p className="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 mb-4 italic">
                          "{candidate.bio}"
                        </p>

                        <div className="space-y-2">
                          <div className="text-xs font-semibold text-slate-500 dark:text-slate-400">Habilidades Certificadas:</div>
                          <div className="flex flex-wrap gap-1.5">
                            {candidate.skills.map((skill, i) => (
                              <span key={i} className="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                                {skill}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      <div className="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
                        <button
                          onClick={() => setOfferModalCandidate(candidate)}
                          className="flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-md shadow-blue-600/20 transition-all flex items-center justify-center gap-2"
                        >
                          <i className="fas fa-paper-plane"></i> Enviar Oferta de Vaga
                        </button>

                        <button
                          onClick={() => handleToggleSaveCandidate(candidate.id)}
                          className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
                            candidate.saved
                              ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20'
                              : 'glass-card hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                          }`}
                          title={candidate.saved ? "Salvo" : "Salvar candidato"}
                        >
                          <i className={`fas ${candidate.saved ? 'fa-bookmark' : 'fa-bookmark'}`}></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                {filteredCandidates.length === 0 && (
                  <div className="text-center py-16 glass-card rounded-3xl">
                    <i className="fas fa-search text-4xl text-slate-400 mb-3"></i>
                    <h3 className="text-lg font-bold">Nenhum candidato encontrado</h3>
                    <p className="text-xs text-slate-500 mt-1">Tente ajustar os filtros ou termos da pesquisa.</p>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL DE ENVIO DE PROPOSTA */}
          {offerModalCandidate && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
              <div className="glass-card w-full max-w-lg p-7 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-xl font-bold">Enviar Proposta de Vaga</h3>
                  <button 
                    onClick={() => setOfferModalCandidate(null)}
                    className="w-8 h-8 rounded-full flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-600"
                  >
                    <i className="fas fa-times"></i>
                  </button>
                </div>

                <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">
                  Você está enviando uma oportunidade direta para <strong>{offerModalCandidate.name}</strong> ({offerModalCandidate.city}).
                </p>

                <form onSubmit={handleSendOffer} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Título da Oportunidade</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: Jovem Aprendiz Administrativo ou Estágio TI"
                      className="w-full px-4 py-2.5 rounded-xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Bolsa / Salário e Benefícios</label>
                    <input
                      type="text"
                      required
                      placeholder="Ex: R$ 1.250,00 + Vale Transporte + VT"
                      className="w-full px-4 py-2.5 rounded-xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Mensagem de Apresentação</label>
                    <textarea
                      rows="3"
                      required
                      value={offerMessage}
                      onChange={(e) => setOfferMessage(e.target.value)}
                      placeholder="Olá! Vimos seu perfil e suas certificações no EducaJovem e gostaríamos de te convidar para uma entrevista..."
                      className="w-full px-4 py-2.5 rounded-xl glass-card text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    ></textarea>
                  </div>

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setOfferModalCandidate(null)}
                      className="px-4 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-md shadow-blue-600/20"
                    >
                      Enviar Proposta Oficial
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER GLOBAL */}
          <footer className="border-t border-slate-200 dark:border-slate-800 py-8 text-center text-xs text-slate-500 dark:text-slate-400">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <i className="fas fa-graduation-cap text-blue-600 text-base"></i>
                <span className="font-bold text-slate-700 dark:text-slate-300">EducaJovem</span> • Plataforma de Qualificação & Empregabilidade
              </div>
              <div>
                Criado com orgulho e tecnologia para transformar o futuro de jovens talentos.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
