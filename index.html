<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaJovem</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #1f2937;
            color: #ffffff;
        }
        .fadeIn {
            animation: fadeIn 0.6s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .header, .footer {
            background: linear-gradient(to right, #6b7280, #1f2937);
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [darkMode, setDarkMode] = useState(localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                document.body.classList.toggle('dark', darkMode);
                localStorage.setItem('theme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            return (
                <div style={{
                    background: darkMode ? '#1b1b1b' : '#f5f5f5',
                    color: darkMode ? '#ffffff' : '#000000',
                }}>
                    <header className="header">
                        <h1>EducaJovem</h1>
                        <button className="button" onClick={() => setDarkMode(!darkMode)}>
                            {darkMode ? <i className="fa-solid fa-sun"></i> : <i className="fa-solid fa-moon"></i>}
                            {darkMode ? ' Modo Claro' : ' Modo Escuro'}
                        </button>
                    </header>
                    <main className="content fadeIn">
                        <p>Bem-vindo à plataforma de empregabilidade jovem!</p>
                    </main>
                    <footer className="footer">
                        <p>&copy; 2023 EducaJovem</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
