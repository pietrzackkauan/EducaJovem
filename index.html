<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EducaJovem</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 font-inter">
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const App = () => {
  const [darkMode, setDarkMode] = useState(() => localStorage.getItem("ej-darkMode") === "true");

  useEffect(() => {
    localStorage.setItem("ej-darkMode", darkMode);
    document.body.classList.toggle('dark', darkMode);
  }, [darkMode]);

  return (
    <div className={darkMode ? 'bg-gray-900 text-gray-200' : 'bg-gray-100 text-gray-800'}>
      <header className="p-4 flex justify-between items-center shadow-lg">
        <h1 className="text-2xl font-bold">EducaJovem</h1>
        <button onClick={() => setDarkMode(!darkMode)}>
          <i className={darkMode ? 'fas fa-sun' : 'fas fa-moon'}></i>
        </button>
      </header>
      <main className="p-8">
        <h2>Bem-vindo à EducaJovem!</h2>
        <p>
          Conectando jovens e empresas com oportunidades e aprendizado.
        </p>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
